<svg width="400" height="143" viewBox="0 0 400 143" xmlns="http://www.w3.org/2000/svg" role="img"><rect x="0.5" y="0.5" width="399" height="142" rx="6" fill="#ffffff" stroke="#e1e4e8"/><text x="20" y="30" font-size="12.5" fill="#586069" font-family="Segoe UI,sans-serif">Stargazed-Dreamer/<tspan font-weight="700" font-size="15" fill="#0969da">MelodyMark</tspan></text><text x="20" y="56" font-size="12.5" fill="#434d58" font-family="Segoe UI,sans-serif">MelodyMark 是一种自己设计的乐谱标记语言。 本项目系统由 </text><text x="20" y="73" font-size="12.5" fill="#434d58" font-family="Segoe UI,sans-serif">编译器 → 合成器 → 播放器 三层构成，并附带  IDE、音源包、</text><text x="20" y="90" font-size="12.5" fill="#434d58" font-family="Segoe UI,sans-serif">MIDI 导入与源导入工具。</text><circle cx="27" cy="128" r="7" fill="#3572A5"/><text x="40" y="133" font-size="12.5" fill="#434d58" font-family="Segoe UI,sans-serif">Python</text><text x="330" y="133" font-size="12.5" fill="#434d58" font-family="Segoe UI,sans-serif">&#9733; 1</text><text x="378" y="133" text-anchor="end" font-size="12.5" fill="#434d58" font-family="Segoe UI,sans-serif">&#9096; 0</text></svg>